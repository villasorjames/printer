<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Storage Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:400px;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

.result{
    margin-top:20px;
    background:#0f172a;
    padding:15px;
    border-radius:10px;
    word-break:break-all;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">

    <h2>Local Storage Generator</h2>

    <input type="text" id="key" placeholder="Enter LocalStorage Key">

    <input type="text" id="value" placeholder="Enter LocalStorage Value">

    <button onclick="generate()">Generate</button>

    <div class="result" id="result">
        Waiting...
    </div>

</div>

<script>
function generate(){

    let key = document.getElementById("key").value;
    let value = document.getElementById("value").value;

    if(!key || !value){
        alert("Please fill all fields");
        return;
    }

    // Save directly to localStorage
    localStorage.setItem(key, value);

    document.getElementById("result").innerHTML = `
        <b>Saved Successfully</b><br><br>
        Key: ${key}<br>
        Value: ${value}
    `;

    console.log("LocalStorage Added");
}
</script>

</body>
</html>
